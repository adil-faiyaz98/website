specVersion: "3.0"
metadata:
  name: domain-dashboards
type: application
framework:
  name: SAPUI5
  version: "1.120.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.f
    - name: sap.uxap
    - name: sap.ui.table
    - name: sap.viz
    - name: sap.suite.ui.microchart
    - name: sap.ui.comp
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        backend:
          - url: /analyst
            destination: srv-api
          - url: /admin
            destination: srv-api
          - url: /auditor
            destination: srv-api
          - url: /executive
            destination: srv-api
          - url: /iam
            destination: srv-api
