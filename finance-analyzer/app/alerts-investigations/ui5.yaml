specVersion: "3.0"
metadata:
  name: alerts-investigations
type: application
framework:
  name: SAPUI5
  version: "1.120.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.uxap
    - name: sap.ui.layout
    - name: sap.f
    - name: sap.suite.ui.commons
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        backend:
          - path: /analyst
            url: http://localhost:4004
          - path: /iam
            url: http://localhost:4004
